<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>String Reverser</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #f0f4f8;
    }
    img { margin-bottom: 1rem; }
    .card {
      background: #fff;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 480px;
    }
    h1 { font-size: 1.5rem; margin-bottom: 1rem; }
    input[type="text"] {
      width: 100%;
      padding: 0.75rem;
      font-size: 1rem;
      border: 2px solid #ddd;
      border-radius: 8px;
      margin-bottom: 0.75rem;
    }
    input[type="text"]:focus { border-color: #4a90d9; outline: none; }
    button {
      width: 100%;
      padding: 0.75rem;
      font-size: 1rem;
      background: #4a90d9;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover { background: #357abd; }
    .result {
      margin-top: 1rem;
      padding: 0.75rem;
      background: #f8fafc;
      border-radius: 8px;
      font-size: 1rem;
      word-break: break-all;
      min-height: 1.5rem;
    }
  </style>
</head>
<body>
  <img src="gif.gif" alt="">
  <div class="card">
    <h1>Reverse a String</h1>
    <input type="text" id="input" placeholder="Type something here…">
    <button onclick="reverse()">Reverse</button>
    <div class="result" id="output"></div>
  </div>
  <script>
    const sounds = ["1.mp3", "2.mp3", "3.mp3", "4.mp3"];
    let index = 0;
    const audio = new Audio();

    function reverse() {
      const str = document.getElementById('input').value;
      const result = str.split(' ').map(word => [...word].reverse().join('')).join(' ');
      document.getElementById('output').textContent = result;

      audio.src = sounds[index];
      audio.play();
      index = (index + 1) % sounds.length;
    }

    document.getElementById('input').addEventListener('keydown', e => {
      if (e.key === 'Enter') reverse();
    });
  </script>
</body>
</html>
